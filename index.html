<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldQuiz</title>

<style>
/* (Sənin CSS eynidir — dəyişməyib) */
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg:#0d0d14;
  --surface:#16161f;
  --card:#1c1c2a;
  --border:#2a2a3d;
  --accent:#7c6dfa;
  --accent2:#fa6d9a;
  --text:#eeeef5;
  --muted:#7070a0;
  --correct:#4ade80;
  --wrong:#f87171;
  --sidebar:210px;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  display:flex;
  overflow:hidden;
}

/* qalan CSS EYNİDİR → qısaltmıram */
</style>
</head>

<body>

<div class="main">
  <div class="container" id="appContainer"></div>
</div>

<script>

// ================= DATA =================

const FLAGS = [
  {flag:"🇦🇿", country:"Azərbaycan"},
  {flag:"🇬🇧", country:"Böyük Britaniya"},
  {flag:"🇫🇷", country:"Fransa"},
  {flag:"🇩🇪", country:"Almaniya"},
  {flag:"🇪🇸", country:"İspaniya"},
  {flag:"🇹🇷", country:"Türkiyə"},
  {flag:"🇷🇺", country:"Rusiya"},
  {flag:"🇸🇦", country:"Səudiyyə Ərəbistanı"},
  {flag:"🇨🇳", country:"Çin"},
  {flag:"🇮🇹", country:"İtaliya"},
  {flag:"🇯🇵", country:"Yaponiya"},
  {flag:"🇵🇹", country:"Portuqaliya"},
];

// ================= HELPERS =================

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function getFlag(country){
  const f = FLAGS.find(x=>x.country===country);
  return f ? f.flag : "🏳️";
}

// ================= MAP DATA =================

const MAP_COUNTRIES = [
  {
    country:"Azərbaycan",
    svg:`<svg viewBox="0 0 200 150">
      <rect width="200" height="150" fill="#1c1c2a"/>
      <path d="M80,40 L120,35 L140,55 L135,80 L110,90 L90,85 L70,70 Z"
      fill="#7c6dfa"/>
    </svg>`
  },
  {
    country:"Fransa",
    svg:`<svg viewBox="0 0 200 150">
      <rect width="200" height="150" fill="#1c1c2a"/>
      <path d="M70,30 L130,28 L150,60 L140,100 L100,115 L60,95 Z"
      fill="#7c6dfa"/>
    </svg>`
  },
  {
    country:"İtaliya",
    svg:`<svg viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#1c1c2a"/>
      <path d="M90,20 L110,50 L120,100 L100,170 L85,120 Z"
      fill="#7c6dfa"/>
    </svg>`
  },
  {
    country:"Yaponiya",
    svg:`<svg viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#1c1c2a"/>
      <circle cx="100" cy="100" r="30" fill="#7c6dfa"/>
    </svg>`
  }
];

// ================= GAME =================

let questions=[],current=0,score=0,answered=false;

function startGame(){
  const picked = shuffle(MAP_COUNTRIES).slice(0,10);

  const all = MAP_COUNTRIES.map(x=>x.country);

  questions = picked.map(m=>({
    display: `
      <div style="text-align:center">
        <div style="font-size:40px">${getFlag(m.country)}</div>
        <div style="margin:10px 0">${m.svg}</div>
        <div style="color:#7070a0;font-size:13px">
          Bu hansı ölkədir?
        </div>
      </div>
    `,
    correct:m.country,
    options: shuffle([m.country,...shuffle(all.filter(x=>x!==m.country)).slice(0,5)]),
    feedback:`${getFlag(m.country)} ${m.country}`
  }));

  current=0;score=0;
  render();
}

function render(){
  const q=questions[current];
  const letters=["A","B","C","D","E","F"];
  answered=false;

  document.getElementById("appContainer").innerHTML=`
  <div style="max-width:500px;margin:auto;text-align:center">

    <div>${q.display}</div>

    <div id="options">
      ${q.options.map((o,i)=>`
        <button onclick="check('${o}',this)">
          ${letters[i]} ${o}
        </button>
      `).join("")}
    </div>

    <div id="fb"></div>

    <button onclick="next()">Next</button>
  </div>`;
}

function check(sel,btn){
  if(answered)return;
  answered=true;

  const q=questions[current];

  if(sel===q.correct){
    score+=10;
    document.getElementById("fb").innerText="Düzdür! "+q.feedback;
  } else {
    document.getElementById("fb").innerText="Yanlış! "+q.correct;
  }
}

function next(){
  current++;
  if(current>=10){
    document.getElementById("appContainer").innerHTML=
      `<h2>Score: ${score}</h2><button onclick="startGame()">Restart</button>`;
  } else render();
}

startGame();

</script>
</body>
</html>
