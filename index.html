<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldQuiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --card: #1c1c2a;
    --border: #2a2a3d;
    --accent: #7c6dfa;
    --accent2: #fa6d9a;
    --text: #eeeef5;
    --muted: #7070a0;
    --correct: #4ade80;
    --wrong: #f87171;
    --sidebar: 210px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar);
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }
  .sidebar-logo {
    padding: 0 18px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sidebar-logo p { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .sidebar-section { padding: 14px 10px 6px; }
  .sidebar-section-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted);
    padding: 0 8px; margin-bottom: 6px;
  }

  .game-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: 10px;
    cursor: pointer; transition: all 0.18s;
    color: var(--muted); font-size: 13px; font-weight: 500;
    margin-bottom: 2px; border: 1.5px solid transparent;
  }
  .game-item:hover { background: rgba(124,109,250,0.08); color: var(--text); }
  .game-item.active {
    background: rgba(124,109,250,0.13);
    border-color: rgba(124,109,250,0.35);
    color: var(--text);
  }
  .game-item .icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }

  /* ── MAIN ── */
  .main {
    margin-left: var(--sidebar);
    flex: 1; display: flex;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 24px 20px;
    min-height: 100vh;
  }

  .container { width: 100%; max-width: 500px; }

  /* ── PROGRESS ── */
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 7px;
  }
  .progress-bar {
    height: 4px; background: var(--border);
    border-radius: 99px; margin-bottom: 20px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px; transition: width 0.5s ease;
  }

  /* ── WORD CARD ── */
  .word-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 36px 32px 28px;
    text-align: center; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .word-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .word-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
  }
  .word-display {
    font-family: 'Syne', sans-serif;
    font-size: 52px; font-weight: 800;
    letter-spacing: -2px; line-height: 1;
    background: linear-gradient(135deg, var(--text) 40%, var(--muted));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    min-height: 60px; display: flex;
    align-items: center; justify-content: center;
  }

  /* flag card for flag quiz */
  .flag-display {
    font-size: 90px; line-height: 1;
    min-height: 100px; display: flex;
    align-items: center; justify-content: center;
  }

  /* map card */
  .map-display {
    min-height: 200px; display: flex;
    align-items: center; justify-content: center;
    font-size: 13px; color: var(--muted);
  }
  .map-display svg { max-width: 100%; max-height: 180px; }

  /* ── OPTIONS ── */
  .options {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 9px; margin-bottom: 14px;
  }
  .option-btn {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 14px 12px;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.18s;
    display: flex; align-items: center; gap: 9px; text-align: left;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(124,109,250,0.09);
    transform: translateY(-1px);
  }
  .option-btn .opt-letter {
    width: 25px; height: 25px; border-radius: 7px;
    background: var(--border); display: flex;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0; color: var(--muted);
  }
  .option-btn.correct { border-color: var(--correct); background: rgba(74,222,128,0.09); }
  .option-btn.correct .opt-letter { background: var(--correct); color: #000; }
  .option-btn.wrong   { border-color: var(--wrong);   background: rgba(248,113,113,0.09); }
  .option-btn.wrong .opt-letter   { background: var(--wrong);   color: #000; }
  .option-btn:disabled { cursor: default; }

  .feedback {
    text-align: center; font-size: 13px;
    min-height: 18px; margin-bottom: 10px;
    color: transparent; transition: color 0.2s;
  }
  .feedback.show-correct { color: var(--correct); font-weight: 500; }
  .feedback.show-wrong   { color: var(--wrong);   font-weight: 500; }

  .next-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px; color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.18s; display: none;
  }
  .next-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .next-btn.visible { display: block; }

  /* ── START ── */
  .start-screen { text-align: center; }
  .start-screen .big-icon { font-size: 68px; margin-bottom: 14px; }
  .start-screen h2 {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800; margin-bottom: 8px;
  }
  .start-screen p { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 26px; }
  .start-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px; color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 17px; font-weight: 700;
    padding: 16px 44px; cursor: pointer; transition: all 0.18s;
  }
  .start-btn:hover { opacity: 0.9; transform: translateY(-2px); }

  /* ── RESULT ── */
  .result-screen {
    text-align: center; background: var(--card);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 44px 32px; display: none;
  }
  .result-screen.visible { display: block; }
  .result-emoji { font-size: 56px; margin-bottom: 10px; }
  .result-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .result-score {
    font-size: 60px; font-family: 'Syne', sans-serif; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1; margin: 12px 0;
  }
  .result-sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .restart-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px; color: #fff;
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
    padding: 14px 34px; cursor: pointer; transition: all 0.18s;
  }
  .restart-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  .game-area { display: none; }
  .game-area.visible { display: block; }

  .animate-in { animation: fadeUp 0.3s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ad-bar {
    position: fixed; bottom: 0; left: var(--sidebar); right: 0;
    height: 52px; background: var(--surface);
    border-top: 1px solid var(--border); z-index: 5;
  }
</style>
</head>

    map:      'Xəritədə bir ölkə göstəriləcək.<br>Hansı ölkə olduğunu<br>6 variantdan seç.',
    currency: 'Bir ölkənin adı göstəriləcək.<br>O ölkənin valyutasını<br>6 variantdan seç.',
    flag:     'Bir bayraq göstəriləcək.<br>Hansı ölkənin bayrağı olduğunu<br>6 variantdan seç.',
  };
  document.getElementById('appContainer').innerHTML = `
    <div class="start-screen animate-in">
      <div class="big-icon">${icons[currentGame]}</div>
      <h2>${titles[currentGame]}</h2>
      <p>${descs[currentGame]}<br><br>10 sual · Hər sual 10 xal</p>
      <button class="start-btn" onclick="startGame()">Oyunu Başlat →</button>
    </div>`;
}

function startGame() {
  if (currentGame === 'word')     questions = buildWordQ();
  if (currentGame === 'map')      questions = buildMapQ();
  if (currentGame === 'currency') questions = buildCurrencyQ();
  if (currentGame === 'flag')     questions = buildFlagQ();
  current = 0; score = 0;
  renderQ();
}

// ── Question builders ──

function buildWordQ() {
  const langs = [...new Set(WORDS.map(w => w.lang))];
  const shuffled = shuffle(WORDS);
  const seen = new Set(); const picked = [];
  for (let w of shuffled) {
    if (!seen.has(w.lang)) { picked.push(w); seen.add(w.lang); if (picked.length===10) break; }
  }
  while (picked.length < 10) { for (let w of shuffled) { if (!picked.includes(w)) { picked.push(w); break; } } }
  return picked.map(w => ({
    display: `<div class="word-label">Bu söz hansı dildədir?</div><div class="word-display">${w.word}</div>`,
    correct: w.lang,
    options: shuffle([w.lang, ...shuffle(langs.filter(l=>l!==w.lang)).slice(0,5)]),
    feedback: `${w.word} — ${w.lang} dili ${w.flag}`
  }));
}

function buildFlagQ() {
  const picked = shuffle(FLAGS).slice(0, 10);
  const allCountries = FLAGS.map(f => f.country);
  return picked.map(f => ({
    display: `<div class="word-label">Bu hansı ölkənin bayrağıdır?</div><div class="flag-display">${f.flag}</div>`,
    correct: f.country,
    options: shuffle([f.country, ...shuffle(allCountries.filter(c=>c!==f.country)).slice(0,5)]),
    feedback: `${f.flag} — ${f.country}`
  }));
}

function buildCurrencyQ() {
  const picked = shuffle(CURRENCIES).slice(0, 10);
  const allCurrencies = CURRENCIES.map(c => c.currency);
  return picked.map(c => ({
    display: `<div class="word-label">${c.country} ölkəsinin valyutası nədir?</div><div class="word-display" style="font-size:36px;letter-spacing:0">${c.country}</div>`,
    correct: c.currency,
    options: shuffle([c.currency, ...shuffle(allCurrencies.filter(v=>v!==c.currency)).slice(0,5)]),
    feedback: `${c.country} → ${c.currency} (${c.symbol})`
  }));
}

function buildMapQ() {
  const picked = shuffle(MAP_COUNTRIES).slice(0, Math.min(10, MAP_COUNTRIES.length));
  // pad if needed
  while (picked.length < 10) picked.push(...shuffle(MAP_COUNTRIES).slice(0, 10 - picked.length));
  const allCountries = MAP_COUNTRIES.map(m => m.country);
  // also add some extra for options
  const extra = ["Türkiyə","Rusiya","Almaniya","Çin","ABŞ","Fransa","İspaniya","Braziliya","Hindistan","Avstriya"];
  const pool = [...new Set([...allCountries, ...extra])];
  return picked.map(m => ({
    display: `<div class="word-label">Bu hansı ölkədir?</div><div class="map-display">${m.svg}</div>`,
    correct: m.country,
    options: shuffle([m.country, ...shuffle(pool.filter(c=>c!==m.country)).slice(0,5)]),
    feedback: `✓ ${m.country}`
  }));
}

// ── Render ──

function renderQ() {
  const q = questions[current];
  const letters = ['A','B','C','D','E','F'];
  answered = false;

  document.getElementById('appContainer').innerHTML = `
    <div class="game-area visible">
      <div class="progress-label">
        <span>Sual ${current+1} / 10</span>
        <span id="scoreLabel">${score} xal</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:${(current/10)*100}%"></div>
      </div>
      <div class="word-card animate-in" id="wordCard">${q.display}</div>
      <div class="options" id="optionsGrid">
        ${q.options.map((opt,i)=>`
          <button class="option-btn" onclick="checkAnswer('${opt.replace(/'/g,"\\'")}',this)">
            <span class="opt-letter">${letters[i]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">
        ${current===9?'Nəticəyə Bax 🏁':'Növbəti Sual →'}
      </button>
    </div>`;
}

function checkAnswer(selected, btn) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const correct = q.correct;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    const txt = b.textContent.trim().slice(1).trim();
    if (txt === correct) b.classList.add('correct');
  });

  const fb = document.getElementById('feedback');
  if (selected === correct) {
    btn.classList.add('correct');
    score += 10;
    fb.textContent = `✓ Doğrudur! ${q.feedback}`;
    fb.className = 'feedback show-correct';
  } else {
    btn.classList.add('wrong');
    fb.textContent = `✗ Yanlış! Düzgün: ${correct}`;
    fb.className = 'feedback show-wrong';
  }
  document.getElementById('scoreLabel').textContent = `${score} xal`;
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQ() {
  current++;
  if (current >= 10) showResult();
  else renderQ();
}

function showResult() {
  const c = score / 10;
  let emoji, title;
  if (c===10)    { emoji='🏆'; title='Möhtəşəm! Mükəmməl!'; }
  else if (c>=8) { emoji='🌟'; title='Əla nəticə!'; }
  else if (c>=6) { emoji='👍'; title='Yaxşıdır!'; }
  else if (c>=4) { emoji='📚'; title='Daha çox öyrən!'; }
  else           { emoji='💪'; title='Məşq et!'; }

  document.getElementById('appContainer').innerHTML = `
    <div class="result-screen visible animate-in">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-score">${c}/10</div>
      <div class="result-sub">${score} xal qazandın!</div>
      <button class="restart-btn" onclick="startGame()">🔄 Yenidən Oyna</button>
    </div>`;
}

// ── Init ──
showStart();
</script>
</body>
</html>
