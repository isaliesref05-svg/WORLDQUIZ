<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldQuiz FIXED</title>

<style>
body{
  margin:0;
  background:#0d0d14;
  color:#eeeef5;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:500px;
  text-align:center;
}

button{
  padding:10px;
  margin:5px;
  width:100%;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.correct{background:#4ade80;}
.wrong{background:#f87171;}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

// ================= DATA =================

const FLAGS = [
  {flag:"🇦🇿", country:"Azərbaycan"},
  {flag:"🇬🇧", country:"Böyük Britaniya"},
  {flag:"🇫🇷", country:"Fransa"},
  {flag:"🇩🇪", country:"Almaniya"},
  {flag:"🇪🇸", country:"İspaniya"},
  {flag:"🇹🇷", country:"Türkiyə"},
  {flag:"🇷🇺", country:"Rusiya"},
  {flag:"🇨🇳", country:"Çin"},
  {flag:"🇯🇵", country:"Yaponiya"},
];

const MAP_COUNTRIES = [
  {
    country:"Azərbaycan",
    svg:`<svg viewBox="0 0 200 150"><rect width="200" height="150" fill="#1c1c2a"/><path d="M80,40 L120,35 L140,55 L135,80 L110,90 L90,85 Z" fill="#7c6dfa"/></svg>`
  },
  {
    country:"Fransa",
    svg:`<svg viewBox="0 0 200 150"><rect width="200" height="150" fill="#1c1c2a"/><path d="M70,30 L130,28 L150,60 L140,100 L100,115 L60,95 Z" fill="#7c6dfa"/></svg>`
  },
  {
    country:"İtaliya",
    svg:`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#1c1c2a"/><path d="M90,20 L110,50 L120,100 L100,170 Z" fill="#7c6dfa"/></svg>`
  },
  {
    country:"Yaponiya",
    svg:`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#1c1c2a"/><circle cx="100" cy="100" r="30" fill="#7c6dfa"/></svg>`
  }
];

// ================= ENGINE =================

let q=[],i=0,score=0,done=false;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

function flagOf(c){
  const f = FLAGS.find(x=>x.country===c);
  return f?f.flag:"🏳️";
}

// ================= MAP FIXED QUIZ =================

function start(){
  const picked = shuffle(MAP_COUNTRIES).slice(0,4);
  const all = MAP_COUNTRIES.map(x=>x.country);

  q = picked.map(m=>({
    correct:m.country,
    display:`
      <div style="font-size:50px">${flagOf(m.country)}</div>
      <div style="margin:10px 0">${m.svg}</div>
      <div style="color:#7070a0">Bu hansı ölkədir?</div>
    `,
    options: shuffle([m.country,...shuffle(all.filter(x=>x!==m.country)).slice(0,3)])
  }));

  i=0;score=0;
  render();
}

function render(){
  const x=q[i];
  document.getElementById("app").innerHTML=`
    <h3>Sual ${i+1}</h3>

    ${x.display}

    ${x.options.map(o=>`
      <button onclick="check('${o}',this)">${o}</button>
    `).join("")}

    <div id="fb"></div>

    <button onclick="next()">Next</button>
  `;
}

function check(a,b){
  if(done)return;
  done=true;

  if(a===q[i].correct){
    score+=10;
    b.className="correct";
    document.getElementById("fb").innerText="Düzdür!";
  }else{
    b.className="wrong";
    document.getElementById("fb").innerText="Yanlış! "+q[i].correct;
  }
}

function next(){
  done=false;
  i++;
  if(i>=q.length){
    document.getElementById("app").innerHTML=`
      <h2>Score: ${score}</h2>
      <button onclick="start()">Restart</button>
    `;
  }else render();
}

start();

</script>

</body>
</html>
