<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldQuiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --card: #1c1c2a;
    --border: #2a2a3d;
    --accent: #7c6dfa;
    --accent2: #fa6d9a;
    --text: #eeeef5;
    --muted: #7070a0;
    --correct: #4ade80;
    --wrong: #f87171;
    --sidebar: 220px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar);
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }

  .sidebar-logo {
    padding: 0 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sidebar-logo p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .sidebar-section {
    padding: 16px 12px 8px;
  }
  .sidebar-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    padding: 0 8px;
    margin-bottom: 6px;
  }

  .game-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
    border: 1.5px solid transparent;
    text-decoration: none;
  }
  .game-item:hover {
    background: rgba(124,109,250,0.08);
    color: var(--text);
  }
  .game-item.active {
    background: rgba(124,109,250,0.13);
    border-color: rgba(124,109,250,0.35);
    color: var(--text);
  }
  .game-item .icon {
    font-size: 18px;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }
  .game-item .badge {
    margin-left: auto;
    font-size: 10px;
    background: var(--accent);
    color: #fff;
    border-radius: 99px;
    padding: 2px 7px;
    font-weight: 700;
  }
  .game-item .badge.soon {
    background: var(--border);
    color: var(--muted);
  }

  /* ── MAIN CONTENT ── */
  .main {
    margin-left: var(--sidebar);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 80px;
    min-height: 100vh;
    position: relative;
  }

  .main::before {
    content: '';
    position: fixed;
    top: -200px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,109,250,0.09) 0%, transparent 70%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 500px;
    position: relative;
    z-index: 1;
  }

  /* ── PAGE TITLE ── */
  .page-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .page-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
  }
  .page-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ── PROGRESS ── */
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  /* ── WORD CARD ── */
  .word-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px 32px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .word-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .word-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }
  .word-display {
    font-family: 'Syne', sans-serif;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(135deg, var(--text) 30%, var(--muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── OPTIONS ── */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 15px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(124,109,250,0.09);
    transform: translateY(-1px);
  }
  .option-btn .opt-letter {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--muted);
  }
  .option-btn.correct { border-color: var(--correct); background: rgba(74,222,128,0.09); }
  .option-btn.correct .opt-letter { background: var(--correct); color: #000; }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(248,113,113,0.09); }
  .option-btn.wrong .opt-letter { background: var(--wrong); color: #000; }
  .option-btn:disabled { cursor: default; }

  /* ── FEEDBACK ── */
  .feedback {
    text-align: center;
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 12px;
    color: transparent;
    transition: color 0.2s;
  }
  .feedback.show-correct { color: var(--correct); font-weight: 500; }
  .feedback.show-wrong   { color: var(--wrong);   font-weight: 500; }

  /* ── NEXT BTN ── */
  .next-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    display: none;
  }
  .next-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .next-btn.visible { display: block; }

  /* ── START SCREEN ── */
  .start-screen {
    text-align: center;
  }
  .start-screen .big-icon { font-size: 72px; margin-bottom: 16px; }
  .start-screen h2 {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800;
    margin-bottom: 8px;
  }
  .start-screen p {
    color: var(--muted); font-size: 14px;
    line-height: 1.7; margin-bottom: 28px;
  }
  .start-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 17px; font-weight: 700;
    padding: 17px 44px;
    cursor: pointer; transition: all 0.18s;
  }
  .start-btn:hover { opacity: 0.9; transform: translateY(-2px); }

  /* ── RESULT ── */
  .result-screen {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 32px;
    display: none;
  }
  .result-screen.visible { display: block; }
  .result-emoji { font-size: 60px; margin-bottom: 12px; }
  .result-title {
    font-family: 'Syne', sans-serif;
    font-size: 24px; font-weight: 800; margin-bottom: 8px;
  }
  .result-score {
    font-size: 64px;
    font-family: 'Syne', sans-serif; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1; margin: 14px 0;
  }
  .result-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .restart-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700;
    padding: 15px 36px;
    cursor: pointer; transition: all 0.18s;
  }
  .restart-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  .game-area { display: none; }
  .game-area.visible { display: block; }

  .animate-in { animation: fadeUp 0.35s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── AD BAR (boş, sonra doldurulacaq) ── */
  .ad-bar {
    position: fixed;
    bottom: 0;
    left: var(--sidebar);
    right: 0;
    height: 56px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 5;
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <h1>WorldQuiz</h1>
    <p>Dünya bilgi oyunları</p>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Oyunlar</div>

    <div class="game-item active" onclick="selectGame('word')">
      <span class="icon">🔤</span>
      Word Quiz
      <span class="badge">Yeni</span>
    </div>

    <div class="game-item" onclick="selectGame('map')">
      <span class="icon">🗺️</span>
      Map Quiz
      <span class="badge soon">Tezliklə</span>
    </div>

    <div class="game-item" onclick="selectGame('flag')">
      <span class="icon">🚩</span>
      Flag Quiz
      <span class="badge soon">Tezliklə</span>
    </div>

    <div class="game-item" onclick="selectGame('currency')">
      <span class="icon">💰</span>
      Currency Quiz
      <span class="badge soon">Tezliklə</span>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="container">

    <!-- START SCREEN -->
    <div class="start-screen" id="startScreen">
      <div class="big-icon">🔤</div>
      <h2>Word Quiz</h2>
      <p>Ekranda bir söz görünəcək.<br>O sözün hansı dildə olduğunu<br>6 variantdan seç.</p>
      <button class="start-btn" onclick="startGame()">Oyunu Başlat →</button>
    </div>

    <!-- GAME AREA -->
    <div class="game-area" id="gameArea">
      <div class="progress-label">
        <span id="questionNum">Sual 1 / 10</span>
        <span id="scoreLabel">0 xal</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="word-card animate-in" id="wordCard">
        <div class="word-label">Bu söz hansı dildədir?</div>
        <div class="word-display" id="wordDisplay">—</div>
      </div>

      <div class="options" id="optionsGrid"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Növbəti Sual →</button>
    </div>

    <!-- RESULT -->
    <div class="result-screen" id="resultScreen">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="result-title" id="resultTitle">Əla!</div>
      <div class="result-score" id="resultScore">10/10</div>
      <div class="result-sub" id="resultSub">100 xal qazandın!</div>
      <button class="restart-btn" onclick="restartGame()">🔄 Yenidən Oyna</button>
    </div>

  </div>
</div>

<!-- AD BAR (boş) -->
<div class="ad-bar"></div>

<script>
const wordBank = [
  { word:"Alma",    language:"Azərbaycan", flag:"🇦🇿" },
  { word:"Günəş",   language:"Azərbaycan", flag:"🇦🇿" },
  { word:"Dəniz",   language:"Azərbaycan", flag:"🇦🇿" },
  { word:"Kitab",   language:"Azərbaycan", flag:"🇦🇿" },
  { word:"Moon",    language:"İngilis",    flag:"🇬🇧" },
  { word:"River",   language:"İngilis",    flag:"🇬🇧" },
  { word:"Cloud",   language:"İngilis",    flag:"🇬🇧" },
  { word:"Stone",   language:"İngilis",    flag:"🇬🇧" },
  { word:"Maison",  language:"Fransız",    flag:"🇫🇷" },
  { word:"Soleil",  language:"Fransız",    flag:"🇫🇷" },
  { word:"Fleur",   language:"Fransız",    flag:"🇫🇷" },
  { word:"Nuage",   language:"Fransız",    flag:"🇫🇷" },
  { word:"Haus",    language:"Alman",      flag:"🇩🇪" },
  { word:"Wasser",  language:"Alman",      flag:"🇩🇪" },
  { word:"Feuer",   language:"Alman",      flag:"🇩🇪" },
  { word:"Baum",    language:"Alman",      flag:"🇩🇪" },
  { word:"Cielo",   language:"İspan",      flag:"🇪🇸" },
  { word:"Tierra",  language:"İspan",      flag:"🇪🇸" },
  { word:"Lluvia",  language:"İspan",      flag:"🇪🇸" },
  { word:"Noche",   language:"İspan",      flag:"🇪🇸" },
  { word:"Deniz",   language:"Türk",       flag:"🇹🇷" },
  { word:"Yıldız",  language:"Türk",       flag:"🇹🇷" },
  { word:"Orman",   language:"Türk",       flag:"🇹🇷" },
  { word:"Rüzgar",  language:"Türk",       flag:"🇹🇷" },
  { word:"Звезда",  language:"Rus",        flag:"🇷🇺" },
  { word:"Облако",  language:"Rus",        flag:"🇷🇺" },
  { word:"Земля",   language:"Rus",        flag:"🇷🇺" },
  { word:"Огонь",   language:"Rus",        flag:"🇷🇺" },
  { word:"شمس",     language:"Ərəb",       flag:"🇸🇦" },
  { word:"قمر",     language:"Ərəb",       flag:"🇸🇦" },
  { word:"بحر",     language:"Ərəb",       flag:"🇸🇦" },
  { word:"نجم",     language:"Ərəb",       flag:"🇸🇦" },
  { word:"山",      language:"Çin",        flag:"🇨🇳" },
  { word:"水",      language:"Çin",        flag:"🇨🇳" },
  { word:"火",      language:"Çin",        flag:"🇨🇳" },
  { word:"月",      language:"Çin",        flag:"🇨🇳" },
  { word:"Mare",    language:"İtalyan",    flag:"🇮🇹" },
  { word:"Luna",    language:"İtalyan",    flag:"🇮🇹" },
  { word:"Fuoco",   language:"İtalyan",    flag:"🇮🇹" },
  { word:"Vento",   language:"İtalyan",    flag:"🇮🇹" },
  { word:"海",      language:"Yapon",      flag:"🇯🇵" },
  { word:"花",      language:"Yapon",      flag:"🇯🇵" },
  { word:"空",      language:"Yapon",      flag:"🇯🇵" },
  { word:"Chuva",   language:"Portuqal",   flag:"🇵🇹" },
  { word:"Pedra",   language:"Portuqal",   flag:"🇵🇹" },
  { word:"Vento",   language:"Portuqal",   flag:"🇵🇹" },
  { word:"Flores",  language:"Portuqal",   flag:"🇵🇹" },
];

const allLanguages = [...new Set(wordBank.map(w => w.language))];

let questions = [], current = 0, score = 0, answered = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function buildQuestions() {
  const shuffled = shuffle(wordBank);
  const seen = new Set();
  const picked = [];
  for (let w of shuffled) {
    if (!seen.has(w.language)) { picked.push(w); seen.add(w.language); if (picked.length === 10) break; }
  }
  while (picked.length < 10) {
    for (let w of shuffled) { if (!picked.includes(w)) { picked.push(w); break; } }
  }
  return picked.map(word => {
    const wrong = shuffle(allLanguages.filter(l => l !== word.language)).slice(0, 5);
    return { word, options: shuffle([word.language, ...wrong]) };
  });
}

function selectGame(type) {
  document.querySelectorAll('.game-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (type !== 'word') {
    alert('Bu oyun tezliklə əlavə olunacaq! 🚀');
    event.currentTarget.classList.remove('active');
    document.querySelector('.game-item').classList.add('active');
  }
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameArea').classList.add('visible');
  questions = buildQuestions();
  current = 0; score = 0;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('questionNum').textContent = `Sual ${current + 1} / 10`;
  document.getElementById('scoreLabel').textContent = `${score} xal`;
  document.getElementById('progressFill').style.width = `${(current / 10) * 100}%`;
  document.getElementById('wordDisplay').textContent = q.word.word;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('visible');

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  const letters = ['A','B','C','D','E','F'];
  q.options.forEach((lang, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span>${lang}`;
    btn.onclick = () => checkAnswer(lang, btn, q);
    grid.appendChild(btn);
  });

  const card = document.getElementById('wordCard');
  card.classList.remove('animate-in');
  void card.offsetWidth;
  card.classList.add('animate-in');
}

function checkAnswer(selected, btn, q) {
  if (answered) return;
  answered = true;
  const correct = q.word.language;
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    const txt = b.textContent.trim().slice(1).trim();
    if (txt === correct) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback');
  if (selected === correct) {
    btn.classList.add('correct');
    score += 10;
    fb.textContent = `✓ Doğrudur! ${q.word.word} — ${correct} dili ${q.word.flag}`;
    fb.className = 'feedback show-correct';
  } else {
    btn.classList.add('wrong');
    fb.textContent = `✗ Yanlış! Düzgün cavab: ${correct} ${q.word.flag}`;
    fb.className = 'feedback show-wrong';
  }
  document.getElementById('scoreLabel').textContent = `${score} xal`;
  const nb = document.getElementById('nextBtn');
  nb.textContent = current === 9 ? 'Nəticəyə Bax 🏁' : 'Növbəti Sual →';
  nb.classList.add('visible');
}

function nextQuestion() {
  current++;
  if (current >= 10) showResult();
  else renderQuestion();
}

function showResult() {
  document.getElementById('gameArea').classList.remove('visible');
  const rs = document.getElementById('resultScreen');
  rs.classList.add('visible');
  const correct = score / 10;
  document.getElementById('resultScore').textContent = `${correct}/10`;
  document.getElementById('resultSub').textContent = `${score} xal qazandın!`;
  let emoji, title;
  if (correct===10)      { emoji='🏆'; title='Möhtəşəm! Mükəmməl!'; }
  else if (correct>=8)   { emoji='🌟'; title='Əla nəticə!'; }
  else if (correct>=6)   { emoji='👍'; title='Yaxşıdır!'; }
  else if (correct>=4)   { emoji='📚'; title='Daha çox öyrən!'; }
  else                   { emoji='💪'; title='Məşq et!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
}

function restartGame() {
  document.getElementById('resultScreen').classList.remove('visible');
  document.getElementById('gameArea').classList.add('visible');
  questions = buildQuestions();
  current = 0; score = 0;
  renderQuestion();
}
</script>
</body>
</html>
