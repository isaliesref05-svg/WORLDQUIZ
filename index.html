<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Quiz Infinite</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: radial-gradient(circle at top, #1f4037, #99f2c8);
}

/* HEADER */
header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(12px);
}

header button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    transition: 0.2s;
}

header button:hover {
    transform: scale(1.05);
}

/* CARD */
.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    margin-top: 20px;
    padding: 25px;
    border-radius: 22px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(18px);
    text-align: center;
    animation: fadeIn 0.3s ease;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.question {
    font-size: 32px;
    margin-bottom: 20px;
}

/* ANSWERS */
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.answers button {
    padding: 15px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-size: 16px;
    color: white;
    background: linear-gradient(135deg, #2193b0, #6dd5ed);
    transition: 0.2s;
}

.answers button:hover {
    transform: scale(1.05);
}

/* COLORS */
.correct {
    background: linear-gradient(135deg, #00b09b, #96c93d) !important;
}

.wrong {
    background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.9);}
    to {opacity: 1; transform: scale(1);}
}

/* MOBILE */
@media (max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
<button onclick="startGame('language')">🌍 Dil</button>
<button onclick="startGame('currency')">💰 Valyuta</button>
<button onclick="startGame('flag')">🚩 Bayraq</button>
<button onclick="startGame('country')">🗺️ Ölkə</button>
</header>

<div class="container">
    <div class="card">
        <div id="question" class="question">Oyuna başla!</div>
        <div id="answers" class="answers"></div>
    </div>
</div>

<script>
const games = {
    language: [
        {question:"Bonjour",correct:"Fransız",options:["Fransız","Türk","Rus","Alman","İspan","İtalyan"]},
        {question:"Hola",correct:"İspan",options:["Fransız","Türk","Rus","Alman","İspan","İtalyan"]},
        {question:"Guten Morgen",correct:"Alman",options:["Fransız","Türk","Rus","Alman","İspan","İtalyan"]}
    ],

    currency: [
        {question:"Yaponiyanın valyutası?",correct:"Yen",options:["Dollar","Yen","Euro","Lira","Manat","Peso"]},
        {question:"Türkiyənin valyutası?",correct:"Lira",options:["Dollar","Yen","Euro","Lira","Manat","Peso"]}
    ],

    flag: [
        {question:"🇧🇷",correct:"Braziliya",options:["Argentina","Braziliya","İspaniya","Meksika","Kolumbiya","Portuqaliya"]},
        {question:"🇯🇵",correct:"Yaponiya",options:["Çin","Koreya","Yaponiya","Tayland","Vyetnam","Monqolustan"]}
    ],

    country: [
        {question:"🇫🇷",correct:"Fransa",options:["Fransa","İtaliya","İspaniya","Almaniya","Belçika","Portuqaliya"]},
        {question:"🇩🇪",correct:"Almaniya",options:["Fransa","İtaliya","İspaniya","Almaniya","Polşa","Avstriya"]}
    ]
};

let current = [];
let i = 0;

function startGame(type){
    current = shuffle(games[type]);
    i = 0;
    show();
}

function show(){
    let q = current[i];

    document.getElementById("question").innerText = q.question;

    let box = document.getElementById("answers");
    box.innerHTML = "";

    q.options.forEach(o=>{
        let b = document.createElement("button");
        b.innerText = o;
        b.onclick = ()=>check(b, o);
        box.appendChild(b);
    });
}

function check(btn, ans){
    let correct = current[i].correct;
    let buttons = document.querySelectorAll(".answers button");

    buttons.forEach(b => b.onclick = null);

    if(ans === correct){
        btn.classList.add("correct");
    } else {
        btn.classList.add("wrong");

        buttons.forEach(b=>{
            if(b.innerText === correct){
                b.classList.add("correct");
            }
        });
    }

    setTimeout(()=>{
        i++;
        if(i >= current.length){
            startGameRandom(); // sonsuz sistem
        } else {
            show();
        }
    }, 1200);
}

/* 🔥 SONSUZ OYUN */
function startGameRandom(){
    let keys = Object.keys(games);
    let random = keys[Math.floor(Math.random()*keys.length)];
    startGame(random);
}

function shuffle(array){
    return array.sort(()=>Math.random()-0.5);
}
</script>

</body>
</html>
