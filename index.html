<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Quiz Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

/* HEADER */
header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

header button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    transition: 0.2s;
}

header button:hover {
    transform: scale(1.05);
}

/* CARD */
.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    margin-top: 20px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    text-align: center;
    animation: fadeIn 0.3s ease;
}

.question {
    font-size: 32px;
    margin-bottom: 20px;
}

/* ANSWERS */
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.answers button {
    padding: 15px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 16px;
    color: white;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    transition: 0.2s;
}

.answers button:hover {
    transform: scale(1.05);
}

/* AD */
.ad {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    text-align: center;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.9);}
    to {opacity: 1; transform: scale(1);}
}

/* MOBILE */
@media (max-width: 600px) {
    .answers {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
<button onclick="startGame('language')">🌍 Dil</button>
<button onclick="startGame('currency')">💰 Valyuta</button>
<button onclick="startGame('flag')">🚩 Bayraq</button>
<button onclick="startGame('country')">🗺️ Ölkə</button>
</header>

<div class="container">
    <div class="card">
        <div id="question" class="question">Oyuna başla!</div>
        <div id="answers" class="answers"></div>
    </div>
</div>

<div class="ad">📢 Reklam yeri</div>

<script>
const games = {
    language: [
        {question:"Bonjour",correct:"Fransız",options:["Fransız","Türk","Rus","Alman","İspan","İtalyan"]},
        {question:"Hola",correct:"İspan",options:["Fransız","Türk","Rus","Alman","İspan","İtalyan"]}
    ],
    currency: [
        {question:"Yaponiyanın valyutası?",correct:"Yen",options:["Dollar","Yen","Euro","Lira","Manat","Peso"]}
    ],
    flag: [
        {question:"🇧🇷",correct:"Braziliya",options:["Argentina","Braziliya","İspaniya","Meksika","Kolumbiya","Portuqaliya"]}
    ],
    country: [
        {question:"🇫🇷",correct:"Fransa",options:["Fransa","İtaliya","İspaniya","Almaniya","Belçika","Portuqaliya"]}
    ]
};

let current = [];
let i = 0;
let score = 0;

function startGame(type){
    current = games[type];
    i = 0;
    score = 0;
    show();
}

function show(){
    let q = current[i];

    document.getElementById("question").innerText = q.question;

    let box = document.getElementById("answers");
    box.innerHTML = "";

    q.options.forEach(o=>{
        let b = document.createElement("button");
        b.innerText = o;
        b.onclick = ()=>check(o);
        box.appendChild(b);
    });
}

function check(a){
    if(a === current[i].correct) score++;
    i++;

    if(i >= current.length){
        end();
    } else {
        show();
    }
}

function end(){
    document.getElementById("question").innerHTML =
        "Oyun bitdi 🎉<br><br>Score: " + score + "/" + current.length;

    document.getElementById("answers").innerHTML = "";
}
</script>

</body>
</html>
