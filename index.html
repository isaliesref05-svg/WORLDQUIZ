<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldQuiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#0d0d14; --surface:#16161f; --card:#1c1c2a; --border:#2a2a3d;
    --accent:#7c6dfa; --accent2:#fa6d9a; --text:#eeeef5; --muted:#7070a0;
    --correct:#4ade80; --wrong:#f87171; --sidebar:210px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;overflow-x:hidden;}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:10;}
  .sidebar-logo{padding:0 18px 20px;border-bottom:1px solid var(--border);}
  .sidebar-logo h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .sidebar-logo p{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidebar-section{padding:14px 10px 6px;}
  .sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:0 8px;margin-bottom:6px;}
  .game-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:all .18s;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:2px;border:1.5px solid transparent;}
  .game-item:hover{background:rgba(124,109,250,.08);color:var(--text);}
  .game-item.active{background:rgba(124,109,250,.13);border-color:rgba(124,109,250,.35);color:var(--text);}
  .game-item .icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}

  /* MAIN */
  .main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px 20px;min-height:100vh;}
  .container{width:100%;max-width:560px;}

  /* PROGRESS */
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;}
  .progress-bar{height:4px;background:var(--border);border-radius:99px;margin-bottom:20px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s ease;}

  /* CARDS */
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 28px 22px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
  .q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .q-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;}

  /* WORD */
  .word-display{font-family:'Syne',sans-serif;font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;background:linear-gradient(135deg,var(--text) 40%,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;min-height:60px;display:flex;align-items:center;justify-content:center;}

  /* FLAG */
  .flag-wrap{display:flex;align-items:center;justify-content:center;padding:8px 0;}
  .flag-wrap svg{width:240px;height:160px;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.4);}

  /* MAP */
  .map-wrap{position:relative;width:100%;height:280px;overflow:hidden;border-radius:12px;background:#111120;}
  .map-wrap svg{width:100%;height:100%;}

  /* CURRENCY */
  .currency-country{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;margin-bottom:4px;}
  .currency-flag-hint{font-size:40px;}

  /* OPTIONS */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
  .option-btn{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:9px;text-align:left;}
  .option-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,109,250,.09);transform:translateY(-1px);}
  .option-btn .opt-letter{width:25px;height:25px;border-radius:7px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--muted);}
  .option-btn.correct{border-color:var(--correct);background:rgba(74,222,128,.09);}
  .option-btn.correct .opt-letter{background:var(--correct);color:#000;}
  .option-btn.wrong{border-color:var(--wrong);background:rgba(248,113,113,.09);}
  .option-btn.wrong .opt-letter{background:var(--wrong);color:#000;}
  .option-btn:disabled{cursor:default;}

  .feedback{text-align:center;font-size:13px;min-height:18px;margin-bottom:10px;color:transparent;transition:color .2s;}
  .feedback.ok{color:var(--correct);font-weight:500;}
  .feedback.bad{color:var(--wrong);font-weight:500;}

  .next-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .18s;display:none;}
  .next-btn:hover{opacity:.9;transform:translateY(-1px);}
  .next-btn.visible{display:block;}

  /* START SCREEN */
  .start-screen{text-align:center;}
  .start-icon{font-size:64px;margin-bottom:14px;}
  .start-screen h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:8px;}
  .start-screen p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:22px;}

  /* DIFFICULTY BUTTONS */
  .diff-row{display:flex;gap:10px;justify-content:center;margin-bottom:24px;}
  .diff-btn{flex:1;max-width:130px;padding:12px 8px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .diff-btn:hover{border-color:var(--accent);color:var(--text);}
  .diff-btn.selected{border-color:var(--accent);background:rgba(124,109,250,.15);color:var(--text);}
  .diff-btn .diff-icon{font-size:22px;}
  .diff-btn .diff-label{font-size:12px;}
  .diff-btn .diff-desc{font-size:10px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;}

  .start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:17px;font-weight:700;padding:16px 44px;cursor:pointer;transition:all .18s;}
  .start-btn:hover{opacity:.9;transform:translateY(-2px);}

  /* RESULT */
  .result-screen{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 32px;}
  .result-emoji{font-size:56px;margin-bottom:10px;}
  .result-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;}
  .result-score{font-size:60px;font-family:'Syne',sans-serif;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:12px 0;}
  .result-sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
  .restart-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;padding:14px 34px;cursor:pointer;transition:all .18s;}
  .restart-btn:hover{opacity:.9;transform:translateY(-1px);}

  .animate-in{animation:fadeUp .3s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  .ad-bar{position:fixed;bottom:0;left:var(--sidebar);right:0;height:52px;background:var(--surface);border-top:1px solid var(--border);z-index:5;}
</style>
</head>

</nav>

// Convert lat/lon to SVG x,y (equirectangular, viewBox 960x500)
function latLonToXY(lat, lon) {
  const x = (lon + 180) * (960 / 360);
  const y = (90 - lat) * (500 / 180);
  return {x, y};
}

// ═══════════ STATE ═══════════
let currentGame = 'word';
let difficulty   = 'easy';
let questions = [], current = 0, score = 0, answered = false;

function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function switchGame(type, el){
  document.querySelectorAll('.game-item').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  currentGame = type;
  showStart();
}

// ═══════════ START SCREEN ═══════════
function showStart(){
  const icons  = {word:'🔤',map:'🗺️',currency:'💰',flag:'🚩'};
  const titles = {word:'Word Quiz',map:'Map Quiz',currency:'Currency Quiz',flag:'Flag Quiz'};
  const descs  = {
    word:    'Ekranda bir söz görünəcək.<br>O sözün hansı dildə olduğunu 6 variantdan seç.',
    map:     'Dünya xəritəsində ölkənin yeri göstəriləcək.<br>Hansı ölkə olduğunu 6 variantdan seç.',
    currency:'Bir ölkənin adı göstəriləcək.<br>O ölkənin valyutasını 6 variantdan seç.',
    flag:    'Bir ölkənin bayrağı göstəriləcək.<br>Hansı ölkə olduğunu 6 variantdan seç.',
  };
  document.getElementById('app').innerHTML = `
    <div class="start-screen animate-in">
      <div class="start-icon">${icons[currentGame]}</div>
      <h2>${titles[currentGame]}</h2>
      <p>${descs[currentGame]}<br><br>10 sual · Hər sual 10 xal</p>
      <div class="diff-row">
        <button class="diff-btn ${difficulty==='easy'?'selected':''}" onclick="setDiff('easy',this)">
          <span class="diff-icon">🟢</span>
          <span class="diff-label">Asan</span>
          <span class="diff-desc">Tanınan ölkələr</span>
        </button>
        <button class="diff-btn ${difficulty==='medium'?'selected':''}" onclick="setDiff('medium',this)">
          <span class="diff-icon">🟡</span>
          <span class="diff-label">Orta</span>
          <span class="diff-desc">Az tanınan</span>
        </button>
        <button class="diff-btn ${difficulty==='hard'?'selected':''}" onclick="setDiff('hard',this)">
          <span class="diff-icon">🔴</span>
          <span class="diff-label">Çətin</span>
          <span class="diff-desc">Çox çətin</span>
        </button>
      </div>
      <button class="start-btn" onclick="startGame()">Oyunu Başlat →</button>
    </div>`;
}

function setDiff(d, el){
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}

// ═══════════ QUESTION BUILDERS ═══════════
function buildWordQ(){
  const pool = WORDS[difficulty];
  const allLangs = [...new Set([...WORDS.easy,...WORDS.medium,...WORDS.hard].map(w=>w.lang))];
  return pool.map(w=>({
    html: `<div class="q-label">Bu söz hansı dildədir?</div><div class="word-display">${w.word}</div>`,
    correct: w.lang,
    options: shuffle([w.lang,...shuffle(allLangs.filter(l=>l!==w.lang)).slice(0,5)]),
    fb: `"${w.word}" — ${w.lang} dili ${w.flag}`
  }));
}

function buildFlagQ(){
  const pool = shuffle(FLAGS_DATA[difficulty]).slice(0,10);
  const allC = [...new Set([...FLAGS_DATA.easy,...FLAGS_DATA.medium,...FLAGS_DATA.hard].map(f=>f.country))];
  return pool.map(f=>({
    html: `<div class="q-label">Bu hansı ölkənin bayrağıdır?</div><div class="flag-wrap">${f.flag_svg}</div>`,
    correct: f.country,
    options: shuffle([f.country,...shuffle(allC.filter(c=>c!==f.country)).slice(0,5)]),
    fb: `${f.country}`
  }));
}

function buildMapQ(){
  const pool = MAP_DATA[difficulty];
  const allC = [...new Set([...MAP_DATA.easy,...MAP_DATA.medium,...MAP_DATA.hard].map(m=>m.country))];
  return pool.map(m=>{
    const {x,y} = latLonToXY(m.lat, m.lon);
    const mapHtml = WORLD_MAP_SVG.replace('id="worldSvg"','id="worldSvg"') +
      `<svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${x}" cy="${y}" r="12" fill="#fa6d9a" opacity="0.35"/>
        <circle cx="${x}" cy="${y}" r="6" fill="#fa6d9a"/>
        <circle cx="${x}" cy="${y}" r="3" fill="#fff"/>
      </svg>`;
    return {
      html: `<div class="q-label">Bu ölkə dünya xəritəsinin hansı yerindədir?</div><div class="map-wrap" style="position:relative">${mapHtml}</div>`,
      correct: m.country,
      options: shuffle([m.country,...shuffle(allC.filter(c=>c!==m.country)).slice(0,5)]),
      fb: `📍 ${m.country}`
    };
  });
}

function buildCurrencyQ(){
  const pool = CURRENCIES_DATA[difficulty];
  const allCurr = [...new Set([...CURRENCIES_DATA.easy,...CURRENCIES_DATA.medium,...CURRENCIES_DATA.hard].map(c=>c.currency))];
  return pool.map(c=>({
    html: `<div class="q-label">${c.country} ölkəsinin valyutası nədir?</div><div class="currency-country">${c.country}</div>`,
    correct: c.currency,
    options: shuffle([c.currency,...shuffle(allCurr.filter(v=>v!==c.currency)).slice(0,5)]),
    fb: `${c.country} → ${c.currency} (${c.symbol})`
  }));
}

// ═══════════ GAME ENGINE ═══════════
function startGame(){
  if(currentGame==='word')     questions = buildWordQ();
  if(currentGame==='map')      questions = buildMapQ();
  if(currentGame==='currency') questions = buildCurrencyQ();
  if(currentGame==='flag')     questions = buildFlagQ();
  current=0; score=0;
  renderQ();
}

function renderQ(){
  answered=false;
  const q = questions[current];
  const letters=['A','B','C','D','E','F'];
  document.getElementById('app').innerHTML=`
    <div class="animate-in">
      <div class="progress-label">
        <span>Sual ${current+1} / 10</span>
        <span id="sl">${score} xal</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${current*10}%"></div></div>
      <div class="q-card">${q.html}</div>
      <div class="options">
        ${q.options.map((o,i)=>`<button class="option-btn" onclick="check('${o.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',this)"><span class="opt-letter">${letters[i]}</span>${o}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <button class="next-btn" id="nb" onclick="nextQ()">${current===9?'Nəticəyə Bax 🏁':'Növbəti Sual →'}</button>
    </div>`;
}

function check(sel,btn){
  if(answered)return;
  answered=true;
  const q=questions[current];
  document.querySelectorAll('.option-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent.trim().slice(1).trim()===q.correct) b.classList.add('correct');
  });
  const fb=document.getElementById('fb');
  if(sel===q.correct){
    btn.classList.add('correct'); score+=10;
    fb.textContent=`✓ Doğrudur! ${q.fb}`;
    fb.className='feedback ok';
  } else {
    btn.classList.add('wrong');
    fb.textContent=`✗ Yanlış! Düzgün: ${q.correct}`;
    fb.className='feedback bad';
  }
  document.getElementById('sl').textContent=`${score} xal`;
  document.getElementById('nb').classList.add('visible');
}

function nextQ(){
  current++;
  if(current>=10) showResult();
  else renderQ();
}

function showResult(){
  const c=score/10;
  let emoji,title;
  if(c===10){emoji='🏆';title='Möhtəşəm! Mükəmməl!';}
  else if(c>=8){emoji='🌟';title='Əla nəticə!';}
  else if(c>=6){emoji='👍';title='Yaxşıdır!';}
  else if(c>=4){emoji='📚';title='Daha çox öyrən!';}
  else{emoji='💪';title='Məşq et!';}
  document.getElementById('app').innerHTML=`
    <div class="result-screen animate-in">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-score">${c}/10</div>
      <div class="result-sub">${score} xal qazandın!</div>
      <button class="restart-btn" onclick="showStart()">🔄 Yenidən Oyna</button>
    </div>`;
}

showStart();
</script>
