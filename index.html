<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldQuiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#0d0d14; --surface:#16161f; --card:#1c1c2a; --border:#2a2a3d;
    --accent:#7c6dfa; --accent2:#fa6d9a; --text:#eeeef5; --muted:#7070a0;
    --correct:#4ade80; --wrong:#f87171; --sidebar:210px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;overflow:hidden;}

  .sidebar{width:var(--sidebar);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:10;}
  .sidebar-logo{padding:0 18px 20px;border-bottom:1px solid var(--border);}
  .sidebar-logo h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .sidebar-logo p{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidebar-section{padding:14px 10px 6px;}
  .sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);padding:0 8px;margin-bottom:6px;}
  .game-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:all .18s;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:2px;border:1.5px solid transparent;}
  .game-item:hover{background:rgba(124,109,250,.08);color:var(--text);}
  .game-item.active{background:rgba(124,109,250,.13);border-color:rgba(124,109,250,.35);color:var(--text);}
  .game-item .icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}

  .main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px 20px;min-height:100vh;}
  .container{width:100%;max-width:540px;}

  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;}
  .progress-bar{height:4px;background:var(--border);border-radius:99px;margin-bottom:18px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s ease;}

  .word-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 32px 24px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden;}
  .word-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .word-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
  .word-display{font-family:'Syne',sans-serif;font-size:50px;font-weight:800;letter-spacing:-2px;line-height:1;background:linear-gradient(135deg,var(--text) 40%,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;min-height:58px;display:flex;align-items:center;justify-content:center;}

  /* FLAG */
  .flag-box{display:flex;align-items:center;justify-content:center;min-height:110px;}
  .flag-svg{width:180px;height:110px;border-radius:6px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.5);border:1px solid var(--border);}

  /* MAP */
  .map-box{position:relative;width:100%;height:240px;border-radius:12px;overflow:hidden;background:#0a1628;}
  .map-box svg{width:100%;height:100%;}
  .map-marker{position:absolute;transform:translate(-50%,-100%);font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));animation:bounce .6s ease infinite alternate;}
  @keyframes bounce{from{transform:translate(-50%,-100%)}to{transform:translate(-50%,-120%)}}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
  .option-btn{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:9px;text-align:left;}
  .option-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,109,250,.09);transform:translateY(-1px);}
  .option-btn .opt-letter{width:25px;height:25px;border-radius:7px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:var(--muted);}
  .option-btn.correct{border-color:var(--correct);background:rgba(74,222,128,.09);}
  .option-btn.correct .opt-letter{background:var(--correct);color:#000;}
  .option-btn.wrong{border-color:var(--wrong);background:rgba(248,113,113,.09);}
  .option-btn.wrong .opt-letter{background:var(--wrong);color:#000;}
  .option-btn:disabled{cursor:default;}

  .feedback{text-align:center;font-size:13px;min-height:18px;margin-bottom:10px;color:transparent;transition:color .2s;}
  .feedback.ok{color:var(--correct);font-weight:500;}
  .feedback.err{color:var(--wrong);font-weight:500;}

  .next-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .18s;display:none;}
  .next-btn:hover{opacity:.9;transform:translateY(-1px);}
  .next-btn.visible{display:block;}

  .start-screen{text-align:center;}
  .start-screen .big-icon{font-size:68px;margin-bottom:14px;}
  .start-screen h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:8px;}
  .start-screen p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:26px;}
  .start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:17px;font-weight:700;padding:16px 44px;cursor:pointer;transition:all .18s;}
  .start-btn:hover{opacity:.9;transform:translateY(-2px);}

  .result-screen{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 32px;display:none;}
  .result-screen.visible{display:block;}
  .result-emoji{font-size:56px;margin-bottom:10px;}
  .result-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;}
  .result-score{font-size:60px;font-family:'Syne',sans-serif;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:12px 0;}
  .result-sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
  .restart-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;padding:14px 34px;cursor:pointer;transition:all .18s;}
  .restart-btn:hover{opacity:.9;transform:translateY(-1px);}

  .game-area{display:none;}
  .game-area.visible{display:block;}
  .animate-in{animation:fadeUp .3s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .ad-bar{position:fixed;bottom:0;left:var(--sidebar);right:0;height:52px;background:var(--surface);border-top:1px solid var(--border);z-index:5;}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">
    <h1>WorldQuiz</h1>
    <p>Dünya bilgi oyunları</p>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Oyunlar</div>
    <div class="game-item active" onclick="switchGame('word',this)"><span class="icon">🔤</span> Word Quiz</div>
    <div class="game-item" onclick="switchGame('map',this)"><span class="icon">🗺️</span> Map Quiz</div>
    <div class="game-item" onclick="switchGame('currency',this)"><span class="icon">💰</span> Currency Quiz</div>
    <div class="game-item" onclick="switchGame('flag',this)"><span class="icon">🚩</span> Flag Quiz</div>
  </div>
</nav>

<div class="main">
  <div class="container" id="appContainer"></div>
</div>
<div class="ad-bar"></div>

// Equirectangular projection: lon→x, lat→y on 540x270 canvas
function coordToXY(lat, lon, W, H) {
  const x = ((lon + 180) / 360) * W;
  const y = ((90 - lat) / 180) * H;
  return {x, y};
}

function buildWorldMapSVG(lat, lon) {
  const W = 530, H = 270;
  const pos = coordToXY(lat, lon, W, H);
  return `
  <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <rect width="${W}" height="${H}" fill="#0a1628"/>
    <!-- Ocean grid lines -->
    <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#1a2a3a" stroke-width="0.5"/>
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="#1a2a3a" stroke-width="0.5"/>
    <!-- Continents simplified fill -->
    <path d="${WORLD_PATH}" fill="#1e3a2f" stroke="#2a5040" stroke-width="0.8" opacity="0.9"/>
    <!-- Graticule -->
    ${[-60,-30,0,30,60].map(lt => {
      const y = ((90-lt)/180)*H;
      return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#1a2a3a" stroke-width="0.4"/>`;
    }).join('')}
    ${[-150,-120,-90,-60,-30,0,30,60,90,120,150].map(ln => {
      const x = ((ln+180)/360)*W;
      return `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#1a2a3a" stroke-width="0.4"/>`;
    }).join('')}
    <!-- Marker -->
    <circle cx="${pos.x}" cy="${pos.y}" r="18" fill="rgba(124,109,250,0.25)" stroke="none">
      <animate attributeName="r" values="14;22;14" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="${pos.x}" cy="${pos.y}" r="8" fill="#fa6d9a" stroke="white" stroke-width="2"/>
    <line x1="${pos.x}" y1="${pos.y}" x2="${pos.x}" y2="${pos.y-22}" stroke="#fa6d9a" stroke-width="2"/>
    <polygon points="${pos.x},${pos.y-22} ${pos.x-5},${pos.y-32} ${pos.x+5},${pos.y-32}" fill="#fa6d9a"/>
  </svg>`;
}

// ENGINE
// ══════════════════════════════════
let currentGame='word', questions=[], current=0, score=0, answered=false;
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

function switchGame(type,el){
  document.querySelectorAll('.game-item').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  currentGame=type;
  showStart();
}

function showStart(){
  const icons={word:'🔤',map:'🗺️',currency:'💰',flag:'🚩'};
  const titles={word:'Word Quiz',map:'Map Quiz',currency:'Currency Quiz',flag:'Flag Quiz'};
  const descs={
    word:'Ekranda bir söz görünəcək.<br>O sözün hansı dildə olduğunu<br>6 variantdan seç.',
    map:'Dünya xəritəsində bir ölkənin<br>yeri işarələnəcək.<br>Hansı ölkə olduğunu 6 variantdan seç.',
    currency:'Bir ölkənin adı göstəriləcək.<br>O ölkənin valyutasını<br>6 variantdan seç.',
    flag:'Bir ölkənin bayrağı göstəriləcək.<br>Hansı ölkə olduğunu<br>6 variantdan seç.',
  };
  document.getElementById('appContainer').innerHTML=`
    <div class="start-screen animate-in">
      <div class="big-icon">${icons[currentGame]}</div>
      <h2>${titles[currentGame]}</h2>
      <p>${descs[currentGame]}<br><br>10 sual · Hər sual 10 xal</p>
      <button class="start-btn" onclick="startGame()">Oyunu Başlat →</button>
    </div>`;
}

function startGame(){
  if(currentGame==='word')     questions=buildWordQ();
  if(currentGame==='map')      questions=buildMapQ();
  if(currentGame==='currency') questions=buildCurrencyQ();
  if(currentGame==='flag')     questions=buildFlagQ();
  current=0; score=0; renderQ();
}

function buildWordQ(){
  const langs=[...new Set(WORDS.map(w=>w.lang))];
  const sh=shuffle(WORDS); const seen=new Set(); const picked=[];
  for(let w of sh){if(!seen.has(w.lang)){picked.push(w);seen.add(w.lang);if(picked.length===10)break;}}
  while(picked.length<10){for(let w of sh){if(!picked.includes(w)){picked.push(w);break;}}}
  return picked.map(w=>({
    display:`<div class="word-label">Bu söz hansı dildədir?</div><div class="word-display">${w.word}</div>`,
    correct:w.lang,
    options:shuffle([w.lang,...shuffle(langs.filter(l=>l!==w.lang)).slice(0,5)]),
    fb:`${w.word} — ${w.lang} ${w.flag}`
  }));
}

function buildMapQ(){
  const picked=shuffle(MAP_COUNTRIES_LIST).slice(0,10);
  return picked.map(c=>{
    const coord=COUNTRY_COORDS[c]||{lat:0,lon:0};
    const mapSVG=buildWorldMapSVG(coord.lat,coord.lon);
    const others=shuffle(MAP_COUNTRIES_LIST.filter(x=>x!==c)).slice(0,5);
    return {
      display:`<div class="word-label">Bu hansı ölkədir?</div><div class="map-box">${mapSVG}</div>`,
      correct:c,
      options:shuffle([c,...others]),
      fb:`📍 ${c}`
    };
  });
}

function buildCurrencyQ(){
  const picked=shuffle(CURRENCIES).slice(0,10);
  const allC=CURRENCIES.map(c=>c.currency);
  return picked.map(c=>({
    display:`<div class="word-label">${c.country} ölkəsinin valyutası?</div><div class="word-display" style="font-size:32px;letter-spacing:0;line-height:1.2">${c.country}</div>`,
    correct:c.currency,
    options:shuffle([c.currency,...shuffle([...new Set(allC)].filter(v=>v!==c.currency)).slice(0,5)]),
    fb:`${c.country} → ${c.currency} ${c.symbol}`
  }));
}

function buildFlagQ(){
  const picked=shuffle(FLAG_COUNTRIES).slice(0,10);
  return picked.map(c=>({
    display:`<div class="word-label">Bu hansı ölkənin bayrağıdır?</div><div class="flag-box"><div class="flag-svg">${FLAG_SVGS[c]}</div></div>`,
    correct:c,
    options:shuffle([c,...shuffle(FLAG_COUNTRIES.filter(x=>x!==c)).slice(0,5)]),
    fb:`${c}`
  }));
}

function renderQ(){
  answered=false;
  const q=questions[current];
  const letters=['A','B','C','D','E','F'];
  document.getElementById('appContainer').innerHTML=`
    <div class="game-area visible">
      <div class="progress-label">
        <span>Sual ${current+1} / 10</span>
        <span id="scoreLabel">${score} xal</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${(current/10)*100}%"></div></div>
      <div class="word-card animate-in">${q.display}</div>
      <div class="options">
        ${q.options.map((opt,i)=>`
          <button class="option-btn" onclick="checkAnswer(${i})">
            <span class="opt-letter">${letters[i]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">${current===9?'Nəticəyə Bax 🏁':'Növbəti Sual →'}</button>
    </div>`;
}

function checkAnswer(idx){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);
  const correctIdx=q.options.indexOf(q.correct);
  btns[correctIdx].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(idx===correctIdx){
    score+=10;
    fb.textContent=`✓ Doğrudur! ${q.fb}`;
    fb.className='feedback ok';
  } else {
    btns[idx].classList.add('wrong');
    fb.textContent=`✗ Yanlış! Düzgün: ${q.correct}`;
    fb.className='feedback err';
  }
  document.getElementById('scoreLabel').textContent=`${score} xal`;
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQ(){
  current++;
  if(current>=10)showResult();
  else renderQ();
}

function showResult(){
  const c=score/10;
  let emoji,title;
  if(c===10){emoji='🏆';title='Möhtəşəm! Mükəmməl!';}
  else if(c>=8){emoji='🌟';title='Əla nəticə!';}
  else if(c>=6){emoji='👍';title='Yaxşıdır!';}
  else if(c>=4){emoji='📚';title='Daha çox öyrən!';}
  else{emoji='💪';title='Məşq et!';}
  document.getElementById('appContainer').innerHTML=`
    <div class="result-screen visible animate-in">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${title}</div>
      <div class="result-score">${c}/10</div>
      <div class="result-sub">${score} xal qazandın!</div>
      <button class="restart-btn" onclick="startGame()">🔄 Yenidən Oyna</button>
    </div>`;
}

showStart();
</script>
