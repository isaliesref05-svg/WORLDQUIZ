<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Quiz Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: radial-gradient(circle at top, #141e30, #243b55);
}

/* TOP LEFT MENU */
header {
    position: fixed;
    top: 10px;
    left: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
}

header button {
    width: 120px;
    padding: 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: white;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    transition: 0.2s;
}

header button:hover {
    transform: scale(1.05);
}

/* GAME AREA */
.container {
    max-width: 700px;
    margin: auto;
    padding-top: 80px;
}

.card {
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    text-align: center;
    animation: fadeIn 0.3s ease;
}

.question {
    font-size: 28px;
    margin-bottom: 15px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.answers button {
    padding: 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    font-size: 15px;
}

.correct {
    background: linear-gradient(135deg, #00b09b, #96c93d) !important;
}

.wrong {
    background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
}

/* FLAG */
.flag {
    width: 120px;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* MAP */
.map {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.95);}
    to {opacity: 1; transform: scale(1);}
}

/* MOBILE */
@media(max-width:600px){
    header button{
        width: 90px;
        font-size: 12px;
    }
    .answers{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- SOL ÜST MENYU -->
<header>
<button onclick="start('flag')">🚩 Bayraq</button>
<button onclick="start('map')">🗺️ Xəritə</button>
<button onclick="start('language')">🌍 Dil</button>
<button onclick="start('currency')">💰 Valyuta</button>
</header>

<div class="container">
<div class="card">

<div id="question" class="question">Oyuna başla</div>
<div id="extra"></div>
<div id="answers" class="answers"></div>

</div>
</div>

<script>

const games = {

flag: [
    {img:"https://flagcdn.com/w320/jp.png",correct:"Yaponiya",options:["Yaponiya","Çin","Koreya","Tayland"]},
    {img:"https://flagcdn.com/w320/br.png",correct:"Braziliya",options:["Argentina","Braziliya","Meksika","Peru"]}
],

map: [
    {text:"Avropada kiçik ölkədir, Alp dağları var",correct:"İsveçrə",options:["Fransa","İsveçrə","Almaniya","İtaliya"]},
    {text:"Çox böyük ölkə, Sibir var",correct:"Rusiya",options:["Kanada","Rusiya","Çin","Qazaxıstan"]}
],

language: [
    {text:"Bonjour hansı dildir?",correct:"Fransız",options:["Fransız","Türk","İspan","Alman"]},
    {text:"Hola hansı dildir?",correct:"İspan",options:["Fransız","Türk","İspan","Alman"]}
],

currency: [
    {text:"Yaponiyanın valyutası?",correct:"Yen",options:["Dollar","Yen","Euro","Lira"]},
    {text:"Türkiyənin valyutası?",correct:"Lira",options:["Dollar","Yen","Euro","Lira"]}
]

};

let current=[];
let i=0;
let type="";

function start(t){
    type=t;
    current = shuffle(games[t]);
    i=0;
    show();
}

function show(){
    let q=current[i];

    document.getElementById("answers").innerHTML="";
    document.getElementById("extra").innerHTML="";

    // FLAG IMAGE
    if(type==="flag"){
        let img=document.createElement("img");
        img.src=q.img;
        img.className="flag";
        document.getElementById("extra").appendChild(img);
    }

    // MAP / TEXT
    if(q.text){
        let d=document.createElement("div");
        d.className="map";
        d.innerText=q.text;
        document.getElementById("extra").appendChild(d);
    }

    document.getElementById("question").innerText="";

    let box=document.getElementById("answers");

    q.options.forEach(o=>{
        let b=document.createElement("button");
        b.innerText=o;
        b.onclick=()=>check(b,o);
        box.appendChild(b);
    });
}

function check(btn,ans){
    let correct=current[i].correct;

    document.querySelectorAll(".answers button").forEach(b=>b.onclick=null);

    if(ans===correct){
        btn.classList.add("correct");
    }else{
        btn.classList.add("wrong");
        document.querySelectorAll(".answers button").forEach(b=>{
            if(b.innerText===correct) b.classList.add("correct");
        });
    }

    setTimeout(()=>{
        i++;
        if(i>=current.length){
            start(type);
        }else{
            show();
        }
    },1000);
}

function shuffle(a){
    return a.sort(()=>Math.random()-0.5);
}

</script>

</body>
</html>
