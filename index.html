<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Quiz Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    background: radial-gradient(circle at top, #141e30, #243b55);
}

header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

header button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff512f, #dd2476);
    transition: 0.2s;
}

header button:hover {
    transform: scale(1.05);
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    margin-top: 20px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    text-align: center;
}

.question {
    font-size: 30px;
    margin-bottom: 20px;
}

/* ANSWERS */
.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.answers button {
    padding: 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
}

.correct { background: linear-gradient(135deg, #00b09b, #96c93d) !important; }
.wrong { background: linear-gradient(135deg, #ff416c, #ff4b2b) !important; }

/* FLAG IMAGE */
.flag {
    width: 120px;
    margin-bottom: 10px;
    border-radius: 8px;
}

/* MAP BOX */
.map {
    font-size: 18px;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    margin-bottom: 10px;
}

@media (max-width:600px){
    .answers{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<header>
<button onclick="start('flag')">🚩 Bayraq</button>
<button onclick="start('map')">🗺️ Xəritə</button>
</header>

<div class="container">
<div class="card">

<div id="question" class="question">Oyuna başla</div>
<div id="extra"></div>
<div id="answers" class="answers"></div>

</div>
</div>

<script>

const games = {

flag: [
    {
        img: "https://flagcdn.com/w320/jp.png",
        correct: "Yaponiya",
        options: ["Yaponiya","Çin","Koreya","Tayland"]
    },
    {
        img: "https://flagcdn.com/w320/br.png",
        correct: "Braziliya",
        options: ["Argentina","Braziliya","Meksika","Peru"]
    }
],

map: [
    {
        text: "Bu ölkə Avropadadır, ərazisi kiçikdir və Alp dağlarına yaxındır",
        correct: "İsveçrə",
        options: ["Fransa","İsveçrə","Almaniya","İtaliya"]
    },
    {
        text: "Bu ölkə çox böyükdür, Sibir bölgəsi var",
        correct: "Rusiya",
        options: ["Kanada","Rusiya","Çin","Qazaxıstan"]
    }
]

};

let current=[];
let i=0;
let type="";

function start(t){
    type=t;
    current = shuffle(games[t]);
    i=0;
    show();
}

function show(){
    let q=current[i];

    document.getElementById("answers").innerHTML="";
    document.getElementById("question").innerText="";

    let extra=document.getElementById("extra");
    extra.innerHTML="";

    // FLAG
    if(type==="flag"){
        let img=document.createElement("img");
        img.src=q.img;
        img.className="flag";
        extra.appendChild(img);
    }

    // MAP
    if(type==="map"){
        let div=document.createElement("div");
        div.className="map";
        div.innerText=q.text;
        extra.appendChild(div);
    }

    let box=document.getElementById("answers");

    q.options.forEach(o=>{
        let b=document.createElement("button");
        b.innerText=o;
        b.onclick=()=>check(b,o);
        box.appendChild(b);
    });
}

function check(btn,ans){
    let correct=current[i].correct;

    document.querySelectorAll(".answers button").forEach(b=>b.onclick=null);

    if(ans===correct){
        btn.classList.add("correct");
    }else{
        btn.classList.add("wrong");

        document.querySelectorAll(".answers button").forEach(b=>{
            if(b.innerText===correct) b.classList.add("correct");
        });
    }

    setTimeout(()=>{
        i++;
        if(i>=current.length){
            start(type);
        }else{
            show();
        }
    },1000);
}

function shuffle(a){
    return a.sort(()=>Math.random()-0.5);
}

</script>

</body>
</html>
